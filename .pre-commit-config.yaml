# T156
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.1  # T959: track CI's `uvx ruff` (floating latest) — the v0.11 pin
    # enforced a different default rule set than CI and flagged 148 errors CI never saw
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
