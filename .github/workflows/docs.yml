# Docs site (T801): build the mkdocs-material docs whenever docs change;
# publishing to GitHub Pages is BEHIND A FLAG — the artifact upload and
# the deploy job run only when the repository variable DOCS_DEPLOY is
# 'true' (Settings -> Secrets and variables -> Actions -> Variables).
# Unset (the default) = the site is still built and checked with
# --strict on every relevant PR/push, but nothing is ever published.
# One-time repo setting required for the deploy path: Pages source
# must be "GitHub Actions".
name: docs

on:
  push:
    branches: [main]
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  pull_request:
    paths:
      - docs/**
      - mkdocs.yml
      - .github/workflows/docs.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # T992: the versioned snapshot loop below walks `git tag` —
          # a shallow clone carries none, so the loop would silently
          # build nothing where the flag is on
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # upper bounds on purpose: mkdocs 2.0 drops the plugin/theming
      # systems material relies on (see material's 2026-02-18 post)
      - run: pip install "mkdocs-material>=9.5,<10" "mkdocs>=1.6,<2"
      # T992: the ROOT site builds FIRST on purpose — mkdocs cleans its
      # own site-dir, so tag dirs written before this line would be
      # wiped from the artifact
      - run: mkdocs build --strict
      # T992: versioned snapshots — one dir per docs-era tag beside the
      # root site, behind the same DOCS_DEPLOY flag as publishing (the
      # versioned site exists only where the site is actually deployed).
      # Pre-docs tags (v0.1.0–v0.3.0) are filtered out here; used
      # directly, the script names them honestly instead.
      - name: Build versioned tag snapshots
        if: vars.DOCS_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          for tag in $(git tag); do
            if git cat-file -e "$tag:mkdocs.yml" 2>/dev/null; then
              python scripts/build_docs_version.py "$tag" --site-dir site
            else
              echo "skip $tag — no mkdocs.yml at that ref (pre-docs era)"
            fi
          done
      - name: Upload Pages artifact
        if: vars.DOCS_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    if: vars.DOCS_DEPLOY == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
