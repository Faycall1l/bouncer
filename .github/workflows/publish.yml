name: publish
on:
  push:
    tags: ["v*"]
jobs:
  build:  # T217+T735+T750: sdist + wheel on tag; upload needs PYPI_TOKEN
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: tag-vs-version guard  # T737: refuse to release a mismatch
        run: python scripts/check_tag.py "$GITHUB_REF_NAME"
      - name: release-notes guard  # T749: no section, no tag
        run: python scripts/check_changelog.py
      - run: pip install build && python -m build --sdist
      - run: python -m build --wheel  # T735: the wheel ships as an artifact too
      - uses: actions/upload-artifact@v4
        with: { name: sdist, path: dist/*.tar.gz }
      - uses: actions/upload-artifact@v4
        with: { name: wheel, path: dist/*.whl }
      # T726: SBOM-ish declared-dependency manifest — deterministic, no
      # network; the release job attaches it alongside the wheel (T736).
      - name: export SBOM
        run: python scripts/sbom.py --out dist/sbom.json
      - uses: actions/upload-artifact@v4
        with: { name: sbom, path: dist/sbom.json }
  release:  # T736: attach wheel + SBOM to the GitHub Release for the tag
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write  # creating a release needs it; nothing else does
    steps:
      - uses: actions/download-artifact@v4
        with: { name: wheel, path: dist }
      - uses: actions/download-artifact@v4
        with: { name: sbom, path: dist }
      # create with generated notes; a re-run uploads --clobber instead
      # of failing on "release already exists"
      - run: |
          gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag \
            dist/*.whl dist/sbom.json \
          || gh release upload "$GITHUB_REF_NAME" --clobber \
            dist/*.whl dist/sbom.json
        env: { GH_TOKEN: "${{ github.token }}" }
