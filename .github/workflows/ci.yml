name: ci
on:
  push:
  pull_request:
  workflow_dispatch:  # T738: manual runs (the bench job is optional)
jobs:
  lint:  # T733: repo-wide ruff once — not once per matrix leg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install ruff
      - run: ruff check .  # T402+T731+T733: the one lint gate
  test:  # T154: 3.10/3.11/3.12 matrix; T162: pip cache
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.11", "3.12", "3.13"] }  # T402
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: "pip" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  weightless:  # T734: docs-consistency + CLI subset — stdlib+fastapi only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      # stdlib + fastapi alone: proves these tests never reach for weights
      - run: pip install pytest "fastapi>=0.110" "pydantic>=2"
      - run: PYTHONPATH=src pytest -q tests/test_cli.py tests/test_p18.py tests/test_p22.py tests/test_p29.py
  bench:  # T738: optional — weightless stub benches; numbers posted, not gated
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]"
      - name: stub benches (no weights, fake routers only)
        run: |
          python eval/bench_stub.py | tee bench-stub.json
          python eval/bench_pool.py --json | tee bench-pool.json
      - name: post step summary
        run: |
          {
            echo "## Benchmarks — weightless stubs (T738)"
            echo ""
            echo "### Stub latency (moderate() overhead)"
            echo '```json'
            cat bench-stub.json
            echo '```'
            echo "### Router pool (fake factory)"
            echo '```json'
            cat bench-pool.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  smoke:  # T161: import check without weights/deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: PYTHONPATH=src python -c "import gatekeeper; print(gatekeeper.__version__)"
  eval-gate:  # T739: gate.py --ci over freshly generated weightless reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]"
      - name: generate the weightless report set
        run: |
          python eval/bench_pool.py
          python eval/breaker_sim.py
      - name: gate them (one-line verdict, stable exits)
        run: python eval/gate.py --all --ci
