name: ci
on:
  push:
  pull_request:
  workflow_dispatch:  # T738: manual runs (the bench job is optional)
jobs:
  lint:  # T733: repo-wide ruff once — not once per matrix leg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5  # T740: uv ships with its own cache
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"
      - run: uvx ruff check .  # T402+T731+T733: same gate, same tool as local
  test:  # T154+T402: 3.10–3.13 matrix; T162: pip cache; T750: comment fixed
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false  # T741: one red leg never cancels the others
      matrix: { python-version: ["3.10", "3.11", "3.12", "3.13"] }  # T402
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}", cache: "pip" }
      - run: pip install -e ".[dev]"
      - run: pytest -q
  weightless:  # T734: docs-consistency + CLI subset — stdlib+fastapi only
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }  # T740: cache it too
      # stdlib + fastapi alone: proves these tests never reach for weights
      - run: pip install pytest "fastapi>=0.110" "pydantic>=2"
      - run: PYTHONPATH=src pytest -q tests/test_cli.py tests/test_p18.py tests/test_p22.py tests/test_p29.py
  bench:  # T738: optional — weightless stub benches; numbers posted, not gated
    if: github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]"
      - name: stub benches (no weights, fake routers only)
        run: |
          python eval/bench_stub.py | tee bench-stub.json
          python eval/bench_pool.py --json | tee bench-pool.json
      - name: post step summary
        run: |
          {
            echo "## Benchmarks — weightless stubs (T738)"
            echo ""
            echo "### Stub latency (moderate() overhead)"
            echo '```json'
            cat bench-stub.json
            echo '```'
            echo "### Router pool (fake factory)"
            echo '```json'
            cat bench-pool.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
  smoke:  # T161: import check without weights/deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: PYTHONPATH=src python -c "import gatekeeper; print(gatekeeper.__version__)"
  eval-gate:  # T739: gate.py --ci over freshly generated weightless reports
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]"
      - name: generate the weightless report set
        run: |
          python eval/bench_pool.py
          python eval/breaker_sim.py
          python eval/bench_stub.py 200
          python eval/bench_warm.py --stub --n 50
          python eval/bench_stats.py --threads 2 --requests 10
          python eval/bench_import.py --n 3
          python eval/bench_questions.py 50
          python eval/bench_batch.py
      - name: gate them (one-line verdict, stable exits)
        run: python eval/gate.py --all --ci
  secret-scan:  # T746: grep-based, stdlib-only — same command locally and here
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python scripts/secret_scan.py
  coverage:  # T747: report the number, upload the json — no floor yet
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      - run: pip install -e ".[dev]"  # pytest-cov rides in dev (T747)
      - run: pytest -q --cov=gatekeeper --cov-report=term --cov-report=json:coverage.json
      - name: post the number (no threshold to flake on)
        if: always()
        run: |
          [ -f coverage.json ] || exit 0
          python - <<'EOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          d = json.load(open("coverage.json"))["totals"]
          print(f"## Coverage (T747)\n\n**{d['percent_covered']:.1f}%** lines "
                f"({d['covered_lines']}/{d['num_statements']} statements)")
          EOF
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: coverage, path: coverage.json }
  audit:  # T781: known-vuln scan of the declared runtime tree
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: "pip" }
      # resolver-only: audits the versions pip would pick from pyproject —
      # no install, no weights, no imports; core deps, extras not scanned
      - run: pip install pip-audit
      # T814: pip-audit -r reads requirements format, not a TOML document —
      # extract the declared core deps first (3.12 job: stdlib tomllib)
      - run: |
          python -c "import tomllib; [print(d) for d in tomllib.load(open('pyproject.toml','rb'))['project']['dependencies']]" > reqs.txt
          # T969: pillow 12.3.0's CVEs are fixed in 13.0.0, but gradio
          # pins pillow<13.0 — the resolver cannot reach the fix. 8 at
          # T969; +16 more on 2026-10-22 when the advisory DB grew (the
          # audit job caught it as a red — all 24 are the same gradio-cap
          # block). Each CVE is listed, never silenced wholesale; drop
          # entries the day gradio lifts the cap and the resolver picks
          # up 13.x.
          pip-audit -r reqs.txt \
            --ignore-vuln CVE-2026-112395 \
            --ignore-vuln CVE-2026-112397 \
            --ignore-vuln CVE-2026-112400 \
            --ignore-vuln CVE-2026-112404 \
            --ignore-vuln CVE-2026-112895 \
            --ignore-vuln CVE-2026-112896 \
            --ignore-vuln CVE-2026-112897 \
            --ignore-vuln CVE-2026-112899 \
            --ignore-vuln CVE-2026-112390 \
            --ignore-vuln CVE-2026-112391 \
            --ignore-vuln CVE-2026-112392 \
            --ignore-vuln CVE-2026-112393 \
            --ignore-vuln CVE-2026-112396 \
            --ignore-vuln CVE-2026-112399 \
            --ignore-vuln CVE-2026-112401 \
            --ignore-vuln CVE-2026-112402 \
            --ignore-vuln CVE-2026-112405 \
            --ignore-vuln CVE-2026-112406 \
            --ignore-vuln CVE-2026-112891 \
            --ignore-vuln CVE-2026-112892 \
            --ignore-vuln CVE-2026-112893 \
            --ignore-vuln CVE-2026-112894 \
            --ignore-vuln CVE-2026-112900 \
            --ignore-vuln CVE-2026-112901
