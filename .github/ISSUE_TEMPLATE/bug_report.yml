name: Bug report
description: Something broke — version, rid, and config first, please.
title: "[bug] "
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: Actual vs expected, full error text (`E_*` codes verbatim).
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: bouncer version
      description: Output of `bouncer --version` (or the tag/commit you run).
      placeholder: "0.3.0"
    validations:
      required: true
  - type: input
    id: rid
    attributes:
      label: rid
      description: >
        Request id from server logs (`"rid": ...` / X-Request-ID header), and
        the rule id (rid) if a specific rule's decision was involved.
      placeholder: "a1b2c3d4e5f6 / no-spam"
    validations:
      required: true
  - type: textarea
    id: config
    attributes:
      label: config
      description: >
        The preset or rules that reproduce it, plus threshold overrides.
        bouncer.toml structure is fine — see the redaction box below.
      render: json
  - type: checkboxes
    id: redaction
    attributes:
      label: Redaction
      options:
        - label: >
            Tokens, API keys, and real chat content are removed — only rule
            ids, structure, and error text remain.
          required: true
