[project]
name = "gatekeeper-1"
version = "0.4.0"
description = "Programmable live-chat moderation in one 30ms System One forward pass (Laya/Jev-compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "gatekeeper-1 contributors" }]
keywords = [  # T609+T724: what an operator would actually search for
  "moderation",
  "chat-moderation",
  "content-moderation",
  "real-time",
  "system-one",
  "jev",
  "laya",
  "typed-decisions",
  "calibration",
]
classifiers = [
  "Development Status :: 4 - Beta",  # T724: 0.x, honest about maturity
  "Intended Audience :: Developers",
  "Intended Audience :: System Administrators",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",  # T401
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Environment :: Console",
  "Environment :: Web Environment",
  "Topic :: Communications :: Chat",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Security",
]
dependencies = [  # T216: lower bounds from smoke-tested versions
  "laya>=0.4.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gradio>=4.44.0",
  "pydantic>=2",  # T722: serve.py's models run on the v2 stack
  "numpy>=1.26",
  "datasets>=3.0.0",
  "huggingface_hub>=0.23",
  "tomli>=2.0; python_version < '3.11'",  # T814: tomllib backport (stdlib 3.11+)
]

[project.urls]
Homepage = "https://github.com/Faycall1l/bouncer"
Issues = "https://github.com/Faycall1l/bouncer/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff", "pytest-cov"]  # T747: coverage numbers in CI
server = ["fastapi>=0.110", "uvicorn>=0.29"]  # T153+T711: floors match core
demo = ["gradio>=4.44.0"]  # T153+T711: floor matches core
discord = ["discord.py>=2.0"]  # T153+T711: app commands need the 2.x tree
mattermost = ["websockets>=12"]  # T694: the only dep the MM adapter wants
adapters = ["discord.py>=2.0", "websockets>=12"]  # T711: every adapter SDK dep
finetune = [  # T729: training stack stays out of the runtime core
  # floors copied from the smoke-tested kaggle bootstrap (train/smoke scripts);
  # laya/datasets/huggingface_hub already ride in core
  "transformers>=4.48.0",
  "torch",  # direct import in train.py; accelerate pins it transitively
  "safetensors",
  "accelerate",  # bootstrap list — setup around torch.amp
  "peft",  # LoRA path (T652), conditional import in train.py
]

[project.scripts]
bouncer = "gatekeeper.cli:main"  # T152

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
gatekeeper = ["py.typed"]  # T725: PEP 561 marker must ship in the wheel

[tool.ruff]
line-length = 100
# T388: Space entry carries HF frontmatter (not plain Python) — lint the package, not it.
exclude = ["app/app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
