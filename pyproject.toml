[project]
name = "gatekeeper-1"
version = "0.2.0"
description = "Programmable live-chat moderation in one 30ms System One forward pass (Laya/Jev-compatible)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "gatekeeper-1 contributors" }]
keywords = ["moderation", "system-one", "jev", "laya", "typed-decisions", "calibration"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",  # T401
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "License :: OSI Approved :: Apache Software License",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [  # T216: lower bounds from smoke-tested versions
  "laya>=0.4.3",
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "gradio>=4.44.0",
  "numpy>=1.26",
  "datasets>=3.0.0",
  "huggingface_hub>=0.23",
]

[project.urls]
Homepage = "https://github.com/Faycall1l/bouncer"
Issues = "https://github.com/Faycall1l/bouncer/issues"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
server = ["fastapi", "uvicorn"]  # T153
demo = ["gradio"]  # T153
discord = ["discord.py"]  # T153

[project.scripts]
bouncer = "gatekeeper.cli:main"  # T152

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
# T388: Space entry carries HF frontmatter (not plain Python) — lint the package, not it.
exclude = ["app/app.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]
